<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3B8"/>
      <stop offset="0.45" stop-color="#FFF1D6"/>
      <stop offset="1" stop-color="#FFF7E6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FD8D0"/>
      <stop offset="1" stop-color="#5FB8B0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD98A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFD98A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB84D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFB84D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#sky)"/>
  <circle cx="820" cy="360" r="330" fill="url(#sun)"/>
  <circle cx="820" cy="360" r="110" fill="#FFE29A"/>
  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="220" cy="300" rx="120" ry="52"/><ellipse cx="300" cy="280" rx="90" ry="60"/><ellipse cx="150" cy="310" rx="70" ry="40"/>
    <ellipse cx="640" cy="200" rx="90" ry="40"/><ellipse cx="700" cy="185" rx="70" ry="48"/>
  </g>
  <!-- far hills -->
  <ellipse cx="200" cy="900" rx="620" ry="260" fill="#CFE6A6"/>
  <ellipse cx="950" cy="930" rx="560" ry="230" fill="#BEDD93"/>
  <!-- mid meadow -->
  <ellipse cx="540" cy="1120" rx="900" ry="300" fill="#A9D67F"/>
  <!-- pond -->
  <ellipse cx="560" cy="1290" rx="470" ry="170" fill="#4EA39B" opacity="0.35"/>
  <ellipse cx="560" cy="1275" rx="450" ry="155" fill="url(#water)"/>
  <ellipse cx="420" cy="1230" rx="170" ry="34" fill="#FFFFFF" opacity="0.25"/>
  <!-- lily pads -->
  <g fill="#7CC27A">
    <path d="M300 1330 a46 22 0 1 0 92 0 l-46 -6 z"/>
    <path d="M760 1300 a40 19 0 1 0 80 0 l-40 -5 z"/>
    <path d="M660 1360 a34 16 0 1 0 68 0 l-34 -4 z"/>
  </g>
  <circle cx="345" cy="1322" r="10" fill="#FFB6C1"/>
  <!-- lanterns floating -->
  <g>
    <circle cx="880" cy="1260" r="60" fill="url(#glow)"/><rect x="862" y="1238" width="36" height="44" rx="10" fill="#FF9A5B"/><rect x="866" y="1244" width="28" height="32" rx="8" fill="#FFD27A"/>
    <circle cx="240" cy="1290" r="60" fill="url(#glow)"/><rect x="222" y="1268" width="36" height="44" rx="10" fill="#FF9A5B"/><rect x="226" y="1274" width="28" height="32" rx="8" fill="#FFD27A"/>
  </g>
  <!-- front bank: stage for Capy -->
  <ellipse cx="540" cy="1560" rx="820" ry="260" fill="#9BCF6E"/>
  <ellipse cx="540" cy="1640" rx="700" ry="220" fill="#8CC66B"/>
  <!-- flowers -->
  <g>
    <g transform="translate(140 1500)"><circle r="14" fill="#FFB84D"/><circle cx="-16" r="10" fill="#FFF"/><circle cx="16" r="10" fill="#FFF"/><circle cy="-16" r="10" fill="#FFF"/><circle cy="16" r="10" fill="#FFF"/></g>
    <g transform="translate(930 1540)"><circle r="12" fill="#FF8A5B"/><circle cx="-14" r="9" fill="#FFE0EC"/><circle cx="14" r="9" fill="#FFE0EC"/><circle cy="-14" r="9" fill="#FFE0EC"/><circle cy="14" r="9" fill="#FFE0EC"/></g>
    <g transform="translate(80 1700)"><circle r="11" fill="#FFD27A"/><circle cx="-12" r="8" fill="#FFF"/><circle cx="12" r="8" fill="#FFF"/><circle cy="-12" r="8" fill="#FFF"/><circle cy="12" r="8" fill="#FFF"/></g>
    <g transform="translate(1000 1720)"><circle r="11" fill="#FFB6C1"/><circle cx="-12" r="8" fill="#FFF"/><circle cx="12" r="8" fill="#FFF"/><circle cy="-12" r="8" fill="#FFF"/><circle cy="12" r="8" fill="#FFF"/></g>
  </g>
  <!-- grass tufts -->
  <g stroke="#6FB35A" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M200 1620 q10 -40 30 -60"/><path d="M230 1625 q0 -40 -10 -70"/>
    <path d="M860 1660 q10 -40 30 -60"/><path d="M890 1665 q0 -40 -10 -70"/>
    <path d="M520 1790 q10 -40 30 -60"/><path d="M550 1795 q0 -40 -10 -70"/>
  </g>
</svg>
