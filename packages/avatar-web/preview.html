<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capy preview</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #fff3dc; overflow: hidden; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      .panel { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: rgba(255,255,255,.85); padding: 8px 10px; border-radius: 10px; font-size: 14px; }
      .panel select, .panel button { font-size: 14px; padding: 4px 8px; }
      .status { position: fixed; bottom: 12px; left: 12px; font-size: 12px; color: #6b4a2b; background: rgba(255,255,255,.7); padding: 4px 8px; border-radius: 6px; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/preview.tsx"></script>
  </body>
</html>
