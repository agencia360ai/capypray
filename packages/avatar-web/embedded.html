<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Capy</title>
    <style>
      html, body, #root { margin: 0; height: 100%; background: transparent; overflow: hidden; touch-action: none; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var post = function (m) { try { window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify(m)); } catch (e) {} };
        window.addEventListener("error", function (e) { post({ type: "error", message: "page: " + (e.message || e) }); });
        window.addEventListener("unhandledrejection", function (e) { post({ type: "error", message: "promise: " + (e.reason && e.reason.message || e.reason) }); });
        post({ type: "boot" });
      })();
    </script>
    <script type="module" src="/src/embedded.tsx"></script>
  </body>
</html>
