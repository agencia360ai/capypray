<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capy Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" />
    <style>
      html, body, #root { margin: 0; height: 100%; background: #FFF3DC; overflow: hidden; font-family: "Nunito", "Segoe UI", system-ui, sans-serif; color: #3B2A1A; }
      canvas { display: block; }
      .brand { position: fixed; top: 14px; right: 14px; z-index: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; pointer-events: none; }
      .brand b { font-size: 15px; font-weight: 800; letter-spacing: 0.02em; }
      .brand span { font-size: 11px; color: #8A6A48; text-transform: uppercase; letter-spacing: 0.12em; }
      .panel { position: fixed; top: 14px; left: 14px; z-index: 2; max-width: min(420px, calc(100vw - 28px)); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: rgba(255,255,255,0.82); backdrop-filter: blur(6px); padding: 10px 12px; border-radius: 16px; font-size: 14px; box-shadow: 0 6px 20px rgba(59,42,26,0.10); }
      .panel label { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #8A6A48; }
      .panel select, .panel button { font: inherit; font-size: 14px; font-weight: 700; color: #3B2A1A; background: #fff; border: 2px solid #F1E2C8; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
      .panel select { text-transform: none; letter-spacing: 0; }
      .panel button:hover, .panel select:hover { border-color: #FFB84D; }
      .panel button:focus-visible, .panel select:focus-visible { outline: 3px solid #FFB84D; outline-offset: 1px; }
      .status { position: fixed; bottom: 14px; left: 14px; right: 14px; z-index: 2; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; color: #8A6A48; background: rgba(255,255,255,0.7); padding: 6px 10px; border-radius: 10px; white-space: pre; overflow-x: auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/artifact.tsx"></script>
  </body>
</html>
